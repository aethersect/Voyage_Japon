<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>SIN → 日本 · Trip Companion</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Trip SG-TW-JP" />
<meta name="theme-color" content="#14213D" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314213D'/%3E%3Ctext x='50' y='62' font-size='46' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314213D'/%3E%3Ctext x='50' y='62' font-size='46' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════
   TOKENS
   Palette : encre navy quasi-noire, papier ivoire, bronze
   mesuré en accent unique (lanternes d'onsen).
   ═══════════════════════════════════════════════════════════ */
:root {
  --ink:        #0B0F19;
  --ink-soft:   #1A2033;
  --paper:      #FBFBF9;
  --surface:    #FFFFFF;
  --surface-2:  #F5F5F2;
  --line:       #EAE8E3;
  --line-soft:  #F1EFEA;
  --muted:      #71767F;
  --muted-2:    #9BA0A8;
  --accent:     #B08343;
  --accent-dim: #F5EDE0;
  --ok:         #16794F;
  --ok-dim:     #EAF5EF;
  --warn:       #A8501E;
  --warn-dim:   #FBF0E7;

  /* Profondeur — ombres portées quasi imperceptibles */
  --sh-1: 0 1px 2px rgba(11,15,25,.04);
  --sh-2: 0 1px 2px rgba(11,15,25,.04), 0 8px 24px -14px rgba(11,15,25,.14);
  --sh-3: 0 2px 4px rgba(11,15,25,.05), 0 16px 40px -20px rgba(11,15,25,.22);

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;

  --ease: cubic-bezier(.4, 0, .2, 1);
}

/* ═══════════════════════════════════════════════════════════
   BASE
   ═══════════════════════════════════════════════════════════ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  color: var(--ink);
  font-feature-settings: 'cv02','cv03','cv04','ss01';
}

/* Chiffres tabulaires : les horaires s'alignent en colonne.
   Choix fonctionnel — un tableau de départs se lit verticalement. */
.tnum, [data-time] { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

#root { min-height: 100vh; }
#fallback { font-family: 'Inter', sans-serif; padding: 56px 24px; text-align: center; color: var(--ink); font-size: 14px; }
::-webkit-scrollbar { display: none; }

/* ═══════════════════════════════════════════════════════════
   SHELL — cadre de l'app, centré, avec respiration sur desktop
   ═══════════════════════════════════════════════════════════ */
.app-shell {
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  background: var(--paper);
  position: relative;
}
@media (min-width: 900px) {
  body { background: #EFEEEA; }
  .app-shell {
    max-width: 460px;
    box-shadow: 0 0 0 1px rgba(11,15,25,.05), 0 40px 100px -30px rgba(11,15,25,.28);
  }
}

/* ═══════════════════════════════════════════════════════════
   HEADER — verre poli discret sur fond encre
   ═══════════════════════════════════════════════════════════ */
.hdr {
  background: var(--ink);
  color: #fff;
  padding: 20px 20px 18px;
  position: sticky; top: 0; z-index: 50;
  overflow: hidden;
}
/* Halo bronze très diffus — une seule touche de couleur chaude */
.hdr::after {
  content: '';
  position: absolute; top: -70%; right: -25%;
  width: 320px; height: 320px; border-radius: 50%;
  background: radial-gradient(circle, rgba(176,131,67,.20), transparent 68%);
  pointer-events: none;
}
.hdr-row { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 1; }
.hdr-title {
  font-size: 20px; font-weight: 700; letter-spacing: -.022em; line-height: 1.15;
}
.hdr-sub {
  font-size: 11.5px; margin-top: 5px; color: rgba(255,255,255,.52);
  letter-spacing: .005em; font-variant-numeric: tabular-nums;
}
.hdr-badge {
  text-align: right;
  padding: 7px 12px; border-radius: 999px;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.11);
  backdrop-filter: blur(10px);
}
.hdr-badge-val { font-size: 17px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.hdr-badge-lbl { font-size: 9px; letter-spacing: .11em; text-transform: uppercase; color: rgba(255,255,255,.5); margin-top: 2px; }
.hdr-badge--live .hdr-badge-val { color: var(--accent); }

/* Rail de progression — les segments reprennent les couleurs de villes,
   comme les lignes d'un plan de métro. */
.hdr-rail { display: flex; gap: 3px; margin-top: 15px; position: relative; z-index: 1; }
.hdr-rail span {
  flex: 1; height: 3px; border-radius: 2px;
  opacity: .82; transition: opacity .3s var(--ease);
}

/* ═══════════════════════════════════════════════════════════
   CARTES
   ═══════════════════════════════════════════════════════════ */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
  transition: box-shadow .3s var(--ease), transform .3s var(--ease), border-color .3s var(--ease);
}
@media (hover: hover) {
  .card--tap:hover { box-shadow: var(--sh-2); border-color: #DFDCD5; transform: translateY(-1px); }
}
.card--tap { cursor: pointer; }
.card--tap:active { transform: scale(.994); }

.section-label {
  font-size: 10px; font-weight: 700; letter-spacing: .13em;
  text-transform: uppercase; color: var(--muted-2);
  margin-bottom: 11px;
}

/* ═══════════════════════════════════════════════════════════
   RAIL — la signature.
   Le voyage est une ligne ; chaque créneau est une station.
   ═══════════════════════════════════════════════════════════ */
.rail { position: relative; padding-left: 26px; }
.rail::before {
  content: '';
  position: absolute; left: 6px; top: 10px; bottom: 10px;
  width: 1.5px;
  background: linear-gradient(180deg, transparent, var(--line) 6%, var(--line) 94%, transparent);
}
.rail-stop { position: relative; padding-bottom: 20px; }
.rail-stop:last-child { padding-bottom: 0; }
.rail-node {
  position: absolute; left: -26px; top: 4px;
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--line);
  transition: all .3s var(--ease);
}
/* Correspondance : nœud plein — un changement de mode ou de ville */
.rail-node--transit {
  background: var(--ink); border-color: var(--ink);
  box-shadow: 0 0 0 4px rgba(11,15,25,.07);
}
.rail-node--accent { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px rgba(176,131,67,.14); }

.slot-time {
  font-size: 11px; font-weight: 600; color: var(--muted);
  letter-spacing: .02em; font-variant-numeric: tabular-nums;
  margin-bottom: 3px;
}
.slot-title { font-size: 14px; font-weight: 600; letter-spacing: -.011em; line-height: 1.35; }
.slot-desc { font-size: 12.5px; color: var(--muted); line-height: 1.58; margin-top: 5px; }
.slot-tip {
  font-size: 11.5px; line-height: 1.55; margin-top: 9px;
  padding: 9px 11px; border-radius: var(--r-sm);
  background: var(--accent-dim); color: #7A5A2B;
  border: 1px solid rgba(176,131,67,.16);
}

/* Lien Maps — discret, prend la couleur de la ligne du jour.
   Présent uniquement sur les créneaux qui sont un lieu réel. */
.slot-map {
  display: inline-flex; align-items: center; gap: 5px;
  margin-top: 9px; padding: 6px 11px 6px 9px;
  border-radius: 999px; border: 1px solid;
  font-size: 11px; font-weight: 600; letter-spacing: -.005em;
  text-decoration: none; background: var(--surface);
  transition: all .22s var(--ease);
}
@media (hover: hover) {
  .slot-map:hover { background: var(--surface-2); transform: translateY(-1px); box-shadow: var(--sh-1); }
}
.slot-map:active { transform: scale(.96); }

/* ═══════════════════════════════════════════════════════════
   PILLS & BADGES
   ═══════════════════════════════════════════════════════════ */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
  white-space: nowrap;
}
.pill--ghost { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill--ink   { background: var(--ink); color: #fff; }
.pill--ok    { background: var(--ok-dim); color: var(--ok); }
.pill--warn  { background: var(--warn-dim); color: var(--warn); }

/* Bandeau transport dans une journée */
.transit-strip {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 11px 13px; border-radius: var(--r-md);
  background: linear-gradient(180deg, #F7F8FA, #F3F4F7);
  border: 1px solid #E4E6EC;
  font-size: 11.5px; line-height: 1.55; color: var(--ink-soft);
}

/* ═══════════════════════════════════════════════════════════
   BOUTONS
   ═══════════════════════════════════════════════════════════ */
.btn {
  padding: 11px 14px; border-radius: var(--r-md);
  font-size: 13px; font-weight: 600; font-family: inherit;
  cursor: pointer; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
  transition: all .22s var(--ease);
  letter-spacing: -.005em;
}
.btn:active { transform: scale(.975); }
@media (hover: hover) { .btn:hover { border-color: #D8D5CE; background: var(--surface-2); } }
.btn--primary { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: var(--sh-1); }
@media (hover: hover) { .btn--primary:hover { background: var(--ink-soft); border-color: var(--ink-soft); box-shadow: var(--sh-2); } }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ═══════════════════════════════════════════════════════════
   BARRE D'ONGLETS — verre poli
   ═══════════════════════════════════════════════════════════ */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  max-width: 480px; margin: 0 auto;
  background: rgba(251,251,249,.86);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  border-top: 1px solid var(--line);
  display: flex; z-index: 60;
  padding-bottom: env(safe-area-inset-bottom, 6px);
}
@media (min-width: 900px) { .tabbar { max-width: 460px; } }
.tab {
  flex: 1; border: none; background: transparent; cursor: pointer;
  padding: 10px 2px 8px; font-family: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  position: relative; transition: opacity .22s var(--ease);
}
.tab-ico { font-size: 17px; line-height: 1; transition: transform .25s var(--ease); }
.tab-lbl { font-size: 9.5px; font-weight: 600; letter-spacing: .02em; }
.tab--on .tab-ico { transform: translateY(-1px) scale(1.06); }
.tab--off { opacity: .38; }
/* Indicateur : un trait fin, comme un marqueur de quai */
.tab-mark {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  height: 2px; border-radius: 0 0 2px 2px;
  transition: width .28s var(--ease), background .28s var(--ease);
}

/* ═══════════════════════════════════════════════════════════
   VALISE — cases à cocher
   ═══════════════════════════════════════════════════════════ */
.pack-row {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 12px 13px; border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line);
  cursor: pointer; transition: all .22s var(--ease);
}
@media (hover: hover) { .pack-row:hover { border-color: #DBD8D1; box-shadow: var(--sh-1); } }
.pack-row--key { border-color: rgba(176,131,67,.32); background: linear-gradient(180deg, #FFFDF9, var(--surface)); }
.pack-row--done { background: var(--ok-dim); border-color: rgba(22,121,79,.2); }
.pack-box {
  width: 19px; height: 19px; border-radius: 6px; flex-shrink: 0; margin-top: 1px;
  border: 1.5px solid var(--line); background: #fff;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 11px; font-weight: 700;
  transition: all .2s var(--ease);
}
.pack-row--done .pack-box { background: var(--ok); border-color: var(--ok); }
.pack-name { font-size: 13px; font-weight: 600; line-height: 1.38; letter-spacing: -.008em; }
.pack-detail { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
.pack-row--done .pack-name { text-decoration: line-through; }
.pack-row--done .pack-body { opacity: .48; }

/* Barre de progression */
.meter { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter-fill { height: 100%; border-radius: 3px; background: var(--ink); transition: width .45s var(--ease); }

/* ═══════════════════════════════════════════════════════════
   ACCESSIBILITÉ
   ═══════════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Entrée de vue — une seule animation, discrète */
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .38s var(--ease) both; }
</style>
</head>
<body>
<div id="root"><div id="fallback">Chargement…</div></div>

<script>
window.addEventListener('error', function(e) {
  var root = document.getElementById('root');
  if (root && root.querySelector('#fallback')) {
    root.innerHTML = '<div id="fallback">\u26a0\ufe0f Erreur : ' + e.message + '<br><br>Recharge la page.</div>';
  }
});
</script>
